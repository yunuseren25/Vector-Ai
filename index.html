<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vektor AI | Fast Multi-Mode AI Workspace</title>
  <meta name="description" content="Vektor AI is a fast, clean, multi-mode AI assistant built for instant answers, coding, writing, and structured learning.">
  <style>
    :root {
      --bg: #090b10;
      --sidebar: #0e1118;
      --surface: #131722;
      --surface-hover: #1a2030;
      --border: #22293a;
      --text: #f1f4f9;
      --muted: #8b95ab;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.16);
      --accent-hover: #2563eb;
      --ok: #10b981;
      --err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 14px;
      flex-shrink: 0;
      transition: transform 0.22s ease;
      z-index: 30;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 1.08rem;
      letter-spacing: 0.4px;
    }

    .brand-badge {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
      color: #fff;
    }

    .new-chat-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .history-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      padding: 0 8px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.83rem;
      color: var(--muted);
      cursor: pointer;
      gap: 8px;
      border: 1px solid transparent;
    }

    .history-item:hover {
      background: var(--surface);
      color: var(--text);
    }

    .history-item.active {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .del-chat-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0.65;
    }

    .del-chat-btn:hover {
      color: var(--err);
      opacity: 1;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      font-size: 0.74rem;
      color: var(--muted);
      text-align: center;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }

    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(14, 17, 24, 0.82);
      backdrop-filter: blur(8px);
    }

    .left-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .menu-toggle {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .mode-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .mode-pill {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .mode-pill:hover {
      color: var(--text);
      border-color: #36415c;
    }

    .mode-pill.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .speed-badge {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ok);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chat-inner {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .welcome-card {
      margin-top: 6vh;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .welcome-card h2 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .welcome-card p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 500px;
      line-height: 1.5;
    }

    .starter-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 640px;
      margin-top: 8px;
    }

    .starter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .starter-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .starter-btn strong {
      display: block;
      font-size: 0.84rem;
      margin-bottom: 3px;
    }

    .starter-btn span {
      font-size: 0.77rem;
      color: var(--muted);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-row.user {
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-items: flex-start;
    }

    .msg-bubble {
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 86%;
    }

    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      padding: 0 4px;
    }

    .msg-action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.74rem;
      cursor: pointer;
    }

    .msg-action-btn:hover {
      color: var(--text);
    }

    .composer-wrap {
      padding: 14px 18px 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, var(--bg) 75%, transparent);
    }

    .composer-box {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.15s;
    }

    .composer-box:focus-within {
      border-color: var(--accent);
    }

    textarea#promptInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.93rem;
      line-height: 1.45;
      resize: none;
      min-height: 26px;
      max-height: 160px;
      outline: none;
      padding: 4px;
    }

    .send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: 9px 16px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .overlay.open {
        display: block;
      }
      .menu-toggle {
        display: inline-block;
      }
      .starter-grid {
        grid-template-columns: 1fr;
      }
      .msg-bubble {
        max-width: 94%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-badge">V</div>
        <span>Vektor AI</span>
      </div>
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>

    <div class="history-label">Recent Conversations</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">Vektor AI &bull; Low-Latency Engine</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="left-top">
        <button class="menu-toggle" onclick="toggleSidebar(true)">&#9776;</button>
        <div class="mode-pills" id="modePills">
          <button class="mode-pill active" data-mode="general" onclick="selectMode('general', this)">General</button>
          <button class="mode-pill" data-mode="code" onclick="selectMode('code', this)">Code &amp; Builder</button>
          <button class="mode-pill" data-mode="writer" onclick="selectMode('writer', this)">Writer &amp; Editor</button>
          <button class="mode-pill" data-mode="study" onclick="selectMode('study', this)">Study &amp; Breakdown</button>
        </div>
      </div>
      <div class="speed-badge" id="speedBadge">Instant Ready</div>
    </header>

    <section class="chat-container" id="chatContainer">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer-box">
        <textarea id="promptInput" rows="1" placeholder="Ask Vektor AI anything..."></textarea>
        <button class="send-btn" id="sendBtn" onclick="handleSend()">Send</button>
      </div>
    </footer>
  </main>

  <script>
    const MODES = {
      general: {
        label: "General",
        prompt: "You are Vektor AI, a fast, sharp, and helpful global AI assistant. Give clear, well-structured, direct answers without unnecessary filler. Match the user's language automatically."
      },
      code: {
        label: "Code & Builder",
        prompt: "You are Vektor AI in Code & Builder mode. Provide clean, production-ready code, clear architecture explanations, and fast debugging solutions. Match the user's language."
      },
      writer: {
        label: "Writer & Editor",
        prompt: "You are Vektor AI in Writer & Editor mode. Craft compelling, clear, polished copy, summaries, or translations tailored to the user's tone. Match the user's language."
      },
      study: {
        label: "Study & Breakdown",
        prompt: "You are Vektor AI in Study & Breakdown mode. Explain complex topics step-by-step using simple analogies, structured bullet points, and quick check questions. Match the user's language."
      }
    };

    const STARTERS = [
      { title: "Build a landing page", desc: "Generate clean HTML & CSS structure fast", text: "Create a modern, responsive SaaS hero section in clean HTML and CSS." },
      { title: "Break down a topic", desc: "Understand any concept step by step", text: "Explain how DNS and SSL certificates work together in simple steps." },
      { title: "Polish my writing", desc: "Rewrite text to sound sharp and natural", text: "Rewrite this product pitch to sound confident, global, and concise:" },
      { title: "Brainstorm ideas", desc: "Generate actionable angles in seconds", text: "Give me 5 unique growth ideas for a new web productivity tool." }
    ];

    let chats = JSON.parse(localStorage.getItem("vektor_chats")) || [];
    let currentChatId = localStorage.getItem("vektor_current_chat") || null;
    let currentMode = localStorage.getItem("vektor_mode") || "general";
    let isStreaming = false;

    const sidebarEl = document.getElementById("sidebar");
    const overlayEl = document.getElementById("overlay");
    const historyListEl = document.getElementById("historyList");
    const chatContainerEl = document.getElementById("chatContainer");
    const chatInnerEl = document.getElementById("chatInner");
    const promptInputEl = document.getElementById("promptInput");
    const sendBtnEl = document.getElementById("sendBtn");
    const speedBadgeEl = document.getElementById("speedBadge");

    document.querySelectorAll(".mode-pill").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.mode === currentMode);
    });

    if (!currentChatId || !chats.some((c) => c.id === currentChatId)) {
      createNewChat(false);
    } else {
      renderHistory();
      renderMessages();
    }

    promptInputEl.addEventListener("input", () => {
      promptInputEl.style.height = "auto";
      promptInputEl.style.height = Math.min(promptInputEl.scrollHeight, 160) + "px";
    });

    promptInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    function toggleSidebar(open) {
      sidebarEl.classList.toggle("open", open);
      overlayEl.classList.toggle("open", open);
    }

    function selectMode(modeKey, btn) {
      currentMode = modeKey;
      localStorage.setItem("vektor_mode", currentMode);
      document.querySelectorAll(".mode-pill").forEach((b) => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    function saveChats() {
      localStorage.setItem("vektor_chats", JSON.stringify(chats));
      if (currentChatId) localStorage.setItem("vektor_current_chat", currentChatId);
    }

    function getActiveChat() {
      return chats.find((c) => c.id === currentChatId);
    }

    function createNewChat(closeMobile = true) {
      const id = "chat_" + Date.now();
      chats.unshift({
        id,
        title: "New Conversation",
        messages: []
      });
      currentChatId = id;
      saveChats();
      renderHistory();
      renderMessages();
      if (closeMobile) toggleSidebar(false);
      promptInputEl.focus();
    }

    function switchChat(id) {
      if (isStreaming) return;
      currentChatId = id;
      saveChats();
      renderHistory();
      renderMessages();
      toggleSidebar(false);
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      if (isStreaming) return;
      chats = chats.filter((c) => c.id !== id);
      if (currentChatId === id) {
        if (chats.length > 0) {
          currentChatId = chats[0].id;
        } else {
          createNewChat(false);
          return;
        }
      }
      saveChats();
      renderHistory();
      renderMessages();
    }

    function renderHistory() {
      historyListEl.innerHTML = "";
      chats.forEach((chat) => {
        const div = document.createElement("div");
        div.className = `history-item ${chat.id === currentChatId ? "active" : ""}`;
        div.onclick = () => switchChat(chat.id);
        div.innerHTML = `
          <span class="history-title">${escapeHtml(chat.title)}</span>
          <button class="del-chat-btn" title="Delete">&times;</button>
        `;
        div.querySelector(".del-chat-btn").onclick = (e) => deleteChat(e, chat.id);
        historyListEl.appendChild(div);
      });
    }

    function renderMessages() {
      const chat = getActiveChat();
      chatInnerEl.innerHTML = "";

      if (!chat || chat.messages.length === 0) {
        const welcome = document.createElement("div");
        welcome.className = "welcome-card";
        welcome.innerHTML = `
          <h2>What can Vektor AI build or solve for you?</h2>
          <p>Ultra-fast responses powered by a multi-mode workspace. Pick a starter below or type your own prompt.</p>
          <div class="starter-grid">
            ${STARTERS.map(
              (s, idx) => `
              <button class="starter-btn" onclick="useStarter(${idx})">
                <strong>${escapeHtml(s.title)}</strong>
                <span>${escapeHtml(s.desc)}</span>
              </button>
            `
            ).join("")}
          </div>
        `;
        chatInnerEl.appendChild(welcome);
        return;
      }

      chat.messages.forEach((msg, index) => {
        appendMessageNode(msg.role, msg.content, index);
      });
      scrollToBottom();
    }

    function useStarter(idx) {
      const starter = STARTERS[idx];
      if (!starter) return;
      promptInputEl.value = starter.text;
      promptInputEl.focus();
    }

    function appendMessageNode(role, content, index) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.textContent = content;
      row.appendChild(bubble);

      if (role === "assistant" && content) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const copyBtn = document.createElement("button");
        copyBtn.className = "msg-action-btn";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => {
          navigator.clipboard?.writeText(bubble.textContent);
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1400);
        };
        actions.appendChild(copyBtn);

        row.appendChild(actions);
      }

      chatInnerEl.appendChild(row);
      return bubble;
    }

    function scrollToBottom() {
      chatContainerEl.scrollTop = chatContainerEl.scrollHeight;
    }

    async function handleSend() {
      if (isStreaming) return;
      const text = promptInputEl.value.trim();
      if (!text) return;

      const chat = getActiveChat();
      if (!chat) return;

      if (chat.messages.length === 0) {
        chat.title = text.slice(0, 36) + (text.length > 36 ? "..." : "");
        renderHistory();
      }

      chat.messages.push({ role: "user", content: text });
      saveChats();

      promptInputEl.value = "";
      promptInputEl.style.height = "auto";
      renderMessages();

      isStreaming = true;
      sendBtnEl.disabled = true;
      speedBadgeEl.textContent = "Streaming...";
      speedBadgeEl.style.color = "#93c5fd";

      const assistantBubble = appendMessageNode("assistant", "", chat.messages.length);
      scrollToBottom();

      const t0 = performance.now();
      let firstChunkMs = null;
      let fullText = "";

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: currentMode,
            systemInstruction: MODES[currentMode]?.prompt || MODES.general.prompt,
            messages: chat.messages
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const raw = trimmed.slice(5).trim();
            if (raw === "[DONE]") continue;

            try {
              const parsed = JSON.parse(raw);
              if (parsed.error) throw new Error(parsed.error);
              if (parsed.text) {
                if (firstChunkMs === null) {
                  firstChunkMs = Math.round(performance.now() - t0);
                }
                fullText += parsed.text;
                assistantBubble.textContent = fullText;
                scrollToBottom();
              }
            } catch (e) {
              if (e.message && !e.message.includes("JSON")) throw e;
            }
          }
        }

        chat.messages.push({ role: "assistant", content: fullText });
        saveChats();
        renderMessages();

        const totalMs = Math.round(performance.now() - t0);
        speedBadgeEl.textContent = `First token: ${firstChunkMs ?? totalMs}ms`;
        speedBadgeEl.style.color = "var(--ok)";
      } catch (err) {
        assistantBubble.textContent = `Connection issue: ${err.message}`;
        speedBadgeEl.textContent = "Error";
        speedBadgeEl.style.color = "var(--err)";
      } finally {
        isStreaming = false;
        sendBtnEl.disabled = false;
        promptInputEl.focus();
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
