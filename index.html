<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vektor AI — Multi-Mode Workspace</title>
  <style>
    :root {
      --bg: #0b0d13;
      --panel: #10141d;
      --card: #161b27;
      --card-hover: #1d2434;
      --border: #252d40;
      --text: #f3f6fb;
      --muted: #939eb5;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --ok: #10b981;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 12px;
      flex-shrink: 0;
      transition: transform 0.22s ease;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      color: #fff;
    }

    .brand-text strong {
      display: block;
      font-size: 1.02rem;
      letter-spacing: 0.3px;
    }

    .brand-text span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .new-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .new-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-top: 2px;
    }

    .side-header span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
    }

    .clear-all-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.72rem;
      cursor: pointer;
    }

    .clear-all-btn:hover {
      color: var(--err);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 0.83rem;
      color: var(--muted);
      cursor: pointer;
      border: 1px solid transparent;
    }

    .chat-item:hover {
      background: var(--card);
      color: var(--text);
    }

    .chat-item.active {
      background: var(--card-hover);
      color: var(--text);
      border-color: var(--border);
    }

    .chat-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-actions {
      display: flex;
      gap: 4px;
    }

    .icon-mini {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .icon-mini:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .icon-mini.del:hover {
      color: var(--err);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }

    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 20, 29, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .hamburger {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .modes {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .mode-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }

    .mode-btn:hover {
      color: var(--text);
      border-color: #3a4663;
    }

    .mode-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .status-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--ok);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Stream Area */
    .stream-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stream-inner {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-empty {
      margin-top: 6vh;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hero-empty h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .hero-empty p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 520px;
      line-height: 1.55;
    }

    .prompts-grid {
      margin-top: 10px;
      width: 100%;
      max-width: 660px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .prompt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }

    .prompt-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .prompt-card strong {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 3px;
    }

    .prompt-card span {
      display: block;
      font-size: 0.77rem;
      color: var(--muted);
    }

    .turn {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .turn.user {
      align-items: flex-end;
    }

    .turn.assistant {
      align-items: flex-start;
    }

    .role-label {
      font-size: 0.71rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0 4px;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 0.93rem;
      line-height: 1.62;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 86%;
    }

    .turn.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .turn.assistant .bubble {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .turn-tools {
      display: flex;
      gap: 10px;
      padding: 0 4px;
    }

    .tool-link {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tool-link:hover {
      color: var(--text);
    }

    /* Composer */
    .dock {
      padding: 12px 18px 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(to top, var(--bg) 78%, transparent);
    }

    .dock-inner {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-shell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 9px 11px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      transition: 0.15s;
    }

    .input-shell:focus-within {
      border-color: var(--accent);
    }

    textarea#composer {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.93rem;
      line-height: 1.45;
      resize: none;
      min-height: 26px;
      max-height: 160px;
      outline: none;
      padding: 4px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-stop {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .dock-hint {
      display: flex;
      justify-content: space-between;
      font-size: 0.73rem;
      color: var(--muted);
      padding: 0 4px;
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .backdrop.open {
        display: block;
      }
      .hamburger {
        display: inline-block;
      }
      .prompts-grid {
        grid-template-columns: 1fr;
      }
      .bubble {
        max-width: 94%;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop" onclick="setDrawer(false)"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">V</div>
      <div class="brand-text">
        <strong>Vektor AI</strong>
        <span>Fast Multi-Mode Engine</span>
      </div>
    </div>

    <button class="new-btn" onclick="newChat()">+ New Chat</button>

    <div class="side-header">
      <span>History</span>
      <button class="clear-all-btn" onclick="clearAllChats()">Clear all</button>
    </div>

    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="hamburger" onclick="setDrawer(true)">&#9776;</button>
        <div class="modes" id="modesBar">
          <button class="mode-btn active" data-mode="general" onclick="pickMode('general', this)">General</button>
          <button class="mode-btn" data-mode="code" onclick="pickMode('code', this)">Code</button>
          <button class="mode-btn" data-mode="writer" onclick="pickMode('writer', this)">Writer</button>
          <button class="mode-btn" data-mode="study" onclick="pickMode('study', this)">Study</button>
        </div>
      </div>
      <div class="status-tag" id="statusTag">Ready</div>
    </header>

    <section class="stream-wrap" id="streamWrap">
      <div class="stream-inner" id="streamInner"></div>
    </section>

    <footer class="dock">
      <div class="dock-inner">
        <div class="input-shell">
          <textarea id="composer" rows="1" placeholder="Message Vektor AI..."></textarea>
          <button class="btn-stop" id="stopBtn" style="display:none;" onclick="stopStream()">Stop</button>
          <button class="btn-primary" id="sendBtn" onclick="sendPrompt()">Send</button>
        </div>
        <div class="dock-hint">
          <span>Enter to send &bull; Shift + Enter for new line</span>
          <span id="modeInfo">Mode: General</span>
        </div>
      </div>
    </footer>
  </main>

  <script>
    const MODE_CONFIG = {
      general: {
        name: "General",
        system: "You are Vektor AI, a fast, clear, and helpful assistant. Give direct, well-organized answers and match the user's language naturally."
      },
      code: {
        name: "Code",
        system: "You are Vektor AI in Code mode. Deliver clean, practical code, clear explanations, and fast debugging. Match the user's language."
      },
      writer: {
        name: "Writer",
        system: "You are Vektor AI in Writer mode. Produce clear, engaging, well-structured writing, edits, or summaries. Match the user's language."
      },
      study: {
        name: "Study",
        system: "You are Vektor AI in Study mode. Break down ideas step by step with clear structure, simple examples, and quick takeaways. Match the user's language."
      }
    };

    const QUICK_CARDS = [
      { title: "Write clean code", sub: "Components, scripts, bug fixes", prompt: "Write a clean JavaScript debounce function with a short usage example." },
      { title: "Explain step by step", sub: "Complex topics made simple", prompt: "Explain how HTTPS encryption works in simple, clear steps." },
      { title: "Draft & polish text", sub: "Emails, captions, summaries", prompt: "Write a concise, confident product launch announcement for a web app." },
      { title: "Plan & organize", sub: "Actionable daily checklists", prompt: "Create a focused 5-step plan to ship a web project cleanly." }
    ];

    let store = JSON.parse(localStorage.getItem("vektor_v2_chats") || "[]");
    let activeId = localStorage.getItem("vektor_v2_active") || null;
    let activeMode = localStorage.getItem("vektor_v2_mode") || "general";
    let abortCtrl = null;
    let busy = false;

    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const chatList = document.getElementById("chatList");
    const streamWrap = document.getElementById("streamWrap");
    const streamInner = document.getElementById("streamInner");
    const composer = document.getElementById("composer");
    const sendBtn = document.getElementById("sendBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusTag = document.getElementById("statusTag");
    const modeInfo = document.getElementById("modeInfo");

    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.mode === activeMode);
    });
    modeInfo.textContent = `Mode: ${MODE_CONFIG[activeMode]?.name || "General"}`;

    if (!activeId || !store.some((c) => c.id === activeId)) {
      newChat(false);
    } else {
      renderSidebar();
      renderThread();
    }

    composer.addEventListener("input", () => {
      composer.style.height = "auto";
      composer.style.height = Math.min(composer.scrollHeight, 160) + "px";
    });

    composer.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    function setDrawer(open) {
      sidebar.classList.toggle("open", open);
      backdrop.classList.toggle("open", open);
    }

    function pickMode(modeKey, btn) {
      activeMode = modeKey;
      localStorage.setItem("vektor_v2_mode", activeMode);
      document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      modeInfo.textContent = `Mode: ${MODE_CONFIG[activeMode]?.name || "General"}`;
    }

    function saveStore() {
      localStorage.setItem("vektor_v2_chats", JSON.stringify(store));
      if (activeId) localStorage.setItem("vektor_v2_active", activeId);
    }

    function currentChat() {
      return store.find((c) => c.id === activeId);
    }

    function newChat(closeDrawer = true) {
      if (busy) return;
      const id = "c_" + Date.now();
      store.unshift({ id, title: "New Chat", messages: [] });
      activeId = id;
      saveStore();
      renderSidebar();
      renderThread();
      if (closeDrawer) setDrawer(false);
      composer.focus();
    }

    function renameChat(e, id) {
      e.stopPropagation();
      const chat = store.find((c) => c.id === id);
      if (!chat) return;
      const next = prompt("Rename conversation:", chat.title);
      if (next && next.trim()) {
        chat.title = next.trim().slice(0, 42);
        saveStore();
        renderSidebar();
      }
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      if (busy) return;
      store = store.filter((c) => c.id !== id);
      if (activeId === id) {
        if (store.length) {
          activeId = store[0].id;
        } else {
          newChat(false);
          return;
        }
      }
      saveStore();
      renderSidebar();
      renderThread();
    }

    function clearAllChats() {
      if (busy) return;
      store = [];
      newChat(false);
    }

    function renderSidebar() {
      chatList.innerHTML = "";
      store.forEach((chat) => {
        const row = document.createElement("div");
        row.className = `chat-item ${chat.id === activeId ? "active" : ""}`;
        row.onclick = () => {
          if (busy) return;
          activeId = chat.id;
          saveStore();
          renderSidebar();
          renderThread();
          setDrawer(false);
        };

        const titleSpan = document.createElement("span");
        titleSpan.className = "chat-title";
        titleSpan.textContent = chat.title;

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "icon-mini";
        editBtn.title = "Rename";
        editBtn.textContent = "✎";
        editBtn.onclick = (e) => renameChat(e, chat.id);

        const delBtn = document.createElement("button");
        delBtn.className = "icon-mini del";
        delBtn.title = "Delete";
        delBtn.textContent = "×";
        delBtn.onclick = (e) => deleteChat(e, chat.id);

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        row.appendChild(titleSpan);
        row.appendChild(actions);
        chatList.appendChild(row);
      });
    }

    function renderThread() {
      const chat = currentChat();
      streamInner.innerHTML = "";

      if (!chat || chat.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "hero-empty";
        empty.innerHTML = `
          <h1>What are we working on?</h1>
          <p>Switch between General, Code, Writer, and Study modes anytime. Fast streaming responses with zero setup needed.</p>
          <div class="prompts-grid">
            ${QUICK_CARDS.map((card, i) => `
              <button class="prompt-card" onclick="fillCard(${i})">
                <strong>${esc(card.title)}</strong>
                <span>${esc(card.sub)}</span>
              </button>
            `).join("")}
          </div>
        `;
        streamInner.appendChild(empty);
        return;
      }

      chat.messages.forEach((m, idx) => {
        const isLastAssistant = m.role === "assistant" && idx === chat.messages.length - 1;
        addTurnElement(m.role, m.content, isLastAssistant);
      });

      streamWrap.scrollTop = streamWrap.scrollHeight;
    }

    function fillCard(index) {
      const card = QUICK_CARDS[index];
      if (!card) return;
      composer.value = card.prompt;
      composer.dispatchEvent(new Event("input"));
      composer.focus();
    }

    function addTurnElement(role, text, showRegen = false) {
      const turn = document.createElement("div");
      turn.className = `turn ${role}`;

      const label = document.createElement("div");
      label.className = "role-label";
      label.textContent = role === "user" ? "You" : "Vektor AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      turn.appendChild(label);
      turn.appendChild(bubble);

      if (role === "assistant" && text) {
        const tools = document.createElement("div");
        tools.className = "turn-tools";

        const copyBtn = document.createElement("button");
        copyBtn.className = "tool-link";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => {
          navigator.clipboard?.writeText(bubble.textContent);
          copyBtn.textContent = "Copied";
          setTimeout(() => (copyBtn.textContent = "Copy"), 1300);
        };
        tools.appendChild(copyBtn);

        if (showRegen && !busy) {
          const regenBtn = document.createElement("button");
          regenBtn.className = "tool-link";
          regenBtn.textContent = "Regenerate";
          regenBtn.onclick = () => regenerateLast();
          tools.appendChild(regenBtn);
        }

        turn.appendChild(tools);
      }

      streamInner.appendChild(turn);
      return bubble;
    }

    function stopStream() {
      if (abortCtrl) {
        abortCtrl.abort();
      }
    }

    async function regenerateLast() {
      if (busy) return;
      const chat = currentChat();
      if (!chat || chat.messages.length < 2) return;
      if (chat.messages[chat.messages.length - 1].role === "assistant") {
        chat.messages.pop();
        saveStore();
        renderThread();
      }
      await runAssistantStream(chat);
    }

    async function sendPrompt() {
      if (busy) return;
      const text = composer.value.trim();
      if (!text) return;

      const chat = currentChat();
      if (!chat) return;

      if (chat.messages.length === 0) {
        chat.title = text.slice(0, 38) + (text.length > 38 ? "..." : "");
        renderSidebar();
      }

      chat.messages.push({ role: "user", content: text });
      saveStore();

      composer.value = "";
      composer.style.height = "auto";
      renderThread();

      await runAssistantStream(chat);
    }

    async function runAssistantStream(chat) {
      busy = true;
      sendBtn.disabled = true;
      stopBtn.style.display = "inline-block";
      statusTag.textContent = "Thinking...";
      statusTag.style.color = "#93c5fd";

      const bubble = addTurnElement("assistant", "", false);
      streamWrap.scrollTop = streamWrap.scrollHeight;

      abortCtrl = new AbortController();
      const t0 = performance.now();
      let firstMs = null;
      let answer = "";

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: abortCtrl.signal,
          body: JSON.stringify({
            mode: activeMode,
            systemInstruction: MODE_CONFIG[activeMode]?.system || MODE_CONFIG.general.system,
            messages: chat.messages
          })
        });

        if (!res.ok) {
          const errJson = await res.json().catch(() => ({}));
          throw new Error(errJson.error || `Request failed (${res.status})`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";

          for (const line of lines) {
            const trim = line.trim();
            if (!trim.startsWith("data:")) continue;
            const raw = trim.slice(5).trim();
            if (!raw || raw === "[DONE]") continue;

            const payload = JSON.parse(raw);
            if (payload.error) throw new Error(payload.error);
            if (payload.text) {
              if (firstMs === null) firstMs = Math.round(performance.now() - t0);
              answer += payload.text;
              bubble.textContent = answer;
              streamWrap.scrollTop = streamWrap.scrollHeight;
            }
          }
        }

        if (answer.trim()) {
          chat.messages.push({ role: "assistant", content: answer });
          saveStore();
        }
        renderThread();

        const elapsed = Math.round(performance.now() - t0);
        statusTag.textContent = `${firstMs ?? elapsed} ms`;
        statusTag.style.color = "var(--ok)";
      } catch (err) {
        if (err.name === "AbortError") {
          if (answer.trim()) {
            chat.messages.push({ role: "assistant", content: answer });
            saveStore();
          }
          renderThread();
          statusTag.textContent = "Stopped";
          statusTag.style.color = "var(--warn)";
        } else {
          bubble.textContent = `Error: ${err.message}`;
          statusTag.textContent = "Error";
          statusTag.style.color = "var(--err)";
        }
      } finally {
        busy = false;
        abortCtrl = null;
        sendBtn.disabled = false;
        stopBtn.style.display = "none";
        composer.focus();
      }
    }

    function esc(str) {
      const el = document.createElement("div");
      el.textContent = str;
      return el.innerHTML;
    }
  </script>
</body>
</html>
